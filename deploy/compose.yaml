name: integrieval
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Configura PUBLIC_APP_URL con tu dominio HTTPS}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      app:
        ipv4_address: 172.30.241.2
    depends_on: [frontend, backend]
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    volumes:
      - ./runtime:/app/config
      - app_data:/app/data
      - backups:/app/backups
    networks: [app]
    depends_on: [ollama]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    networks: [app]
    depends_on: [backend]
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    volumes: ["ollama_models:/root/.ollama"]
    networks: [app]
  model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: [tools]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "llama3.2:3b"]
    depends_on: [ollama]
    networks: [app]
volumes:
  app_data:
  backups:
  ollama_models:
  caddy_data:
  caddy_config:
networks:
  app:
    ipam:
      config:
        - subnet: 172.30.241.0/24
